<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Utkarsh — Web Designer & Developer
  </title>

  <meta
    name="description"
    content="Utkarsh is a web designer and developer creating modern, responsive and interactive digital experiences."
  >

  <meta
    name="theme-color"
    content="#07111f"
  >


  <!-- =========================
       FONTS
  ========================= -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >


  <style>


    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family: "Inter", Arial, sans-serif;

      color: #f5f7ff;

      overflow-x: hidden;

      background:

        radial-gradient(
          circle at 10% 5%,
          rgba(0, 153, 255, 0.16),
          transparent 28%
        ),

        radial-gradient(
          circle at 90% 15%,
          rgba(117, 70, 255, 0.18),
          transparent 30%
        ),

        radial-gradient(
          circle at 50% 75%,
          rgba(0, 215, 255, 0.06),
          transparent 35%
        ),

        linear-gradient(
          135deg,
          #040914 0%,
          #081426 45%,
          #050817 100%
        );
    }


    a {
      text-decoration: none;
      color: inherit;
    }


    button {
      font-family: inherit;
    }


    /* =====================================================
       BACKGROUND GRID
    ===================================================== */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: -2;

      opacity: 0.35;

      background-image:

        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size: 60px 60px;
    }


    /* =====================================================
       AMBIENT LIGHT
    ===================================================== */

    body::after {

      content: "";

      position: fixed;

      width: 700px;
      height: 700px;

      border-radius: 50%;

      left: 50%;
      top: 45%;

      transform: translate(-50%, -50%);

      pointer-events: none;

      z-index: -3;

      background:

        radial-gradient(
          circle,
          rgba(45, 122, 255, 0.08),
          transparent 68%
        );

      animation:
        ambientMove
        12s
        ease-in-out
        infinite
        alternate;
    }


    @keyframes ambientMove {

      from {

        transform:
          translate(-55%, -48%)
          scale(1);

      }


      to {

        transform:
          translate(-45%, -52%)
          scale(1.18);

      }

    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .container {

      width:
        min(1180px, 90%);

      margin:
        0 auto;

    }


    /* =====================================================
       NAVBAR
    ===================================================== */

    .navbar {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      z-index: 1000;

      padding:
        20px 0;

      transition:
        0.35s ease;

    }


    .navbar.scrolled {

      background:
        rgba(4, 9, 20, 0.82);

      backdrop-filter:
        blur(22px);

      border-bottom:
        1px solid
        rgba(255,255,255,0.08);

    }


    .nav {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

    }


    .logo {

      font-size:
        21px;

      font-weight:
        900;

      letter-spacing:
        3px;

    }


    .nav-links {

      display: flex;

      align-items: center;

      gap:
        30px;

    }


    .nav-links a {

      font-size:
        13px;

      color:
        #98a6bd;

      transition:
        0.3s ease;

    }


    .nav-links a:hover {

      color:
        #ffffff;

    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {

      min-height:
        100vh;

      display:
        flex;

      align-items:
        center;

      padding:
        130px 0 80px;

      position:
        relative;

    }


    .hero-grid {

      display:
        grid;

      grid-template-columns:
        1.05fr
        0.95fr;

      gap:
        60px;

      align-items:
        center;

    }


    .badge {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        9px;

      padding:
        10px 16px;

      border-radius:
        999px;

      border:
        1px solid
        rgba(255,255,255,0.1);

      background:
        rgba(255,255,255,0.035);

      color:
        #aebbd0;

      font-size:
        10px;

      font-weight:
        600;

      letter-spacing:
        2px;

      margin-bottom:
        30px;

    }


    .dot {

      width:
        7px;

      height:
        7px;

      border-radius:
        50%;

      background:
        #57d9ff;

      box-shadow:
        0 0 16px
        rgba(87,217,255,0.9);

      animation:
        pulse
        1.8s
        infinite;

    }


    @keyframes pulse {

      0%,
      100% {

        transform:
          scale(0.85);

        opacity:
          0.65;

      }


      50% {

        transform:
          scale(1.35);

        opacity:
          1;

      }

    }


    .hero h1 {

      font-size:
        clamp(58px, 8vw, 108px);

      line-height:
        0.88;

      letter-spacing:
        -6px;

      margin-bottom:
        30px;

    }


    .gradient {

      background:

        linear-gradient(
          90deg,
          #ffffff,
          #72b5ff,
          #c28cff
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;

      color:
        transparent;

    }


    .hero-description {

      max-width:
        610px;

      color:
        #9da9bd;

      font-size:
        17px;

      line-height:
        1.8;

      margin-bottom:
        35px;

    }


    .buttons {

      display:
        flex;

      gap:
        14px;

      flex-wrap:
        wrap;

    }


    .btn {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        15px 23px;

      border-radius:
        999px;

      font-size:
        12px;

      font-weight:
        800;

      letter-spacing:
        0.3px;

      transition:
        0.3s ease;

    }


    .btn-primary {

      background:
        #ffffff;

      color:
        #07101d;

      box-shadow:
        0 12px 35px
        rgba(255,255,255,0.08);

    }


    .btn-secondary {

      border:
        1px solid
        rgba(255,255,255,0.12);

      background:
        rgba(255,255,255,0.035);

      color:
        #dce5f4;

    }


    .btn:hover {

      transform:
        translateY(-4px);

    }


    /* =====================================================
       HERO VISUAL
    ===================================================== */

    .visual {

      height:
        520px;

      position:
        relative;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      perspective:
        1000px;

      transition:
        transform
        0.15s ease-out;

    }


    .orb {

      width:
        300px;

      height:
        300px;

      border-radius:
        50%;

      background:

        radial-gradient(
          circle at 28% 20%,
          #ffffff 0%,
          #b9d6ff 5%,
          rgba(86,143,255,0.72) 20%,
          rgba(91,140,255,0.2) 48%,
          transparent 72%
        );

      box-shadow:

        0 0 100px
        rgba(91,140,255,0.25),

        inset
        -45px
        -40px
        75px
        rgba(0,0,0,0.55);

      animation:
        orbFloat
        7s
        ease-in-out
        infinite;

    }


    @keyframes orbFloat {

      0%,
      100% {

        transform:
          translateY(0)
          rotate(0deg);

      }


      50% {

        transform:
          translateY(-22px)
          rotate(8deg);

      }

    }


    .ring {

      position:
        absolute;

      width:
        420px;

      height:
        145px;

      border-radius:
        50%;

      border:
        1px solid
        rgba(119,170,255,0.35);

      animation:
        ringSpin
        10s
        linear
        infinite;

    }


    .ring-two {

      position:
        absolute;

      width:
        455px;

      height:
        160px;

      border-radius:
        50%;

      border:
        1px solid
        rgba(190,130,255,0.2);

      animation:
        ringSpinReverse
        13s
        linear
        infinite;

    }


    @keyframes ringSpin {

      from {

        transform:
          rotate(-20deg);

      }


      to {

        transform:
          rotate(340deg);

      }

    }


    @keyframes ringSpinReverse {

      from {

        transform:
          rotate(60deg);

      }


      to {

        transform:
          rotate(-300deg);

      }

    }


    .floating-card {

      position:
        absolute;

      padding:
        14px 18px;

      border-radius:
        15px;

      border:
        1px solid
        rgba(255,255,255,0.1);

      background:
        rgba(9,17,37,0.72);

      backdrop-filter:
        blur(18px);

      color:
        #b5c2da;

      font-size:
        10px;

      font-weight:
        700;

      letter-spacing:
        1.5px;

      animation:
        floatingCard
        5s
        ease-in-out
        infinite;

    }


    .card-one {

      top:
        70px;

      right:
        20px;

    }


    .card-two {

      bottom:
        75px;

      left:
        10px;

      animation-delay:
        1.5s;

    }


    @keyframes floatingCard {

      0%,
      100% {

        transform:
          translateY(0);

      }


      50% {

        transform:
          translateY(-13px);

      }

    }


    /* =====================================================
       GENERAL SECTIONS
    ===================================================== */

    section:not(.hero) {

      padding:
        125px 0;

    }


    .label {

      font-size:
        10px;

      font-weight:
        700;

      letter-spacing:
        4px;

      text-transform:
        uppercase;

      color:
        #71809c;

      margin-bottom:
        18px;

    }


    .title {

      font-size:
        clamp(45px, 6vw, 78px);

      line-height:
        0.95;

      letter-spacing:
        -4px;

      margin-bottom:
        60px;

    }


    /* =====================================================
       PROJECTS
    ===================================================== */

    .projects-grid {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        22px;

    }


    .project-card {

      position:
        relative;

      min-height:
        560px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        space-between;

      overflow:
        hidden;

      padding:
        28px;

      border-radius:
        28px;

      border:
        1px solid
        rgba(255,255,255,0.1);

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.02)
        );

      transition:
        transform 0.4s ease,
        border-color 0.4s ease,
        box-shadow 0.4s ease;

    }


    .project-card::before {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      opacity:
        0;

      transition:
        0.4s ease;

      pointer-events:
        none;

    }


    .project-one::before {

      background:

        radial-gradient(
          circle at 50% 0%,
          rgba(255,126,62,0.22),
          transparent 60%
        );

    }


    .project-two::before {

      background:

        radial-gradient(
          circle at 50% 0%,
          rgba(70,180,255,0.2),
          transparent 60%
        );

    }


    .project-three::before {

      background:

        radial-gradient(
          circle at 50% 0%,
          rgba(190,130,255,0.22),
          transparent 60%
        );

    }


    .project-card:hover {

      transform:
        translateY(-10px);

      border-color:
        rgba(140,180,255,0.35);

      box-shadow:
        0 30px 80px
        rgba(0,0,0,0.3);

    }


    .project-card:hover::before {

      opacity:
        1;

    }


    .project-content {

      position:
        relative;

      z-index:
        2;

    }


    .project-top {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin-bottom:
        75px;

    }


    .project-number {

      font-size:
        11px;

      font-weight:
        800;

      letter-spacing:
        2px;

      color:
        #7e8da8;

    }


    .project-type {

      font-size:
        9px;

      font-weight:
        800;

      letter-spacing:
        1.5px;

      padding:
        8px 11px;

      border-radius:
        999px;

      background:
        rgba(255,255,255,0.06);

      border:
        1px solid
        rgba(255,255,255,0.08);

      color:
        #aab7ca;

    }


    .project-card h3 {

      font-size:
        clamp(31px, 3vw, 42px);

      letter-spacing:
        -2px;

      margin-bottom:
        17px;

    }


    .project-description {

      color:
        #94a0b6;

      line-height:
        1.75;

      font-size:
        14px;

      margin-bottom:
        25px;

    }


    .tags {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

    }


    .tag {

      padding:
        8px 10px;

      border-radius:
        999px;

      font-size:
        9px;

      font-weight:
        700;

      color:
        #aebbd0;

      background:
        rgba(255,255,255,0.045);

      border:
        1px solid
        rgba(255,255,255,0.07);

    }


    .project-footer {

      position:
        relative;

      z-index:
        2;

    }


    .project-link {

      width:
        100%;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        15px 18px;

      border-radius:
        15px;

      background:
        rgba(255,255,255,0.08);

      border:
        1px solid
        rgba(255,255,255,0.1);

      font-size:
        11px;

      font-weight:
        800;

      letter-spacing:
        0.5px;

      transition:
        0.3s ease;

    }


    .project-link:hover {

      background:
        #ffffff;

      color:
        #07101d;

      transform:
        translateY(-3px);

    }


    /* =====================================================
       SERVICES
    ===================================================== */

    .service-grid {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        20px;

    }


    .service {

      min-height:
        300px;

      padding:
        32px;

      border-radius:
        25px;

      border:
        1px solid
        rgba(255,255,255,0.09);

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.07),
          rgba(255,255,255,0.02)
        );

      transition:
        0.35s ease;

    }


    .service:hover {

      transform:
        translateY(-9px);

      border-color:
        rgba(100,160,255,0.35);

      box-shadow:
        0 25px 70px
        rgba(0,0,0,0.2);

    }


    .service-number {

      color:
        #61708c;

      font-size:
        10px;

      font-weight:
        700;

      letter-spacing:
        2px;

      margin-bottom:
        65px;

    }


    .service h3 {

      font-size:
        24px;

      margin-bottom:
        15px;

    }


    .service p {

      color:
        #8490a6;

      line-height:
        1.75;

      font-size:
        14px;

    }


    /* =====================================================
       ABOUT
    ===================================================== */

    .about-grid {

      display:
        grid;

      grid-template-columns:
        0.7fr
        1.3fr;

      gap:
        80px;

    }


    .about-small {

      color:
        #71809b;

      font-size:
        14px;

      line-height:
        1.8;

      letter-spacing:
        1px;

    }


    .about-text {

      font-size:
        clamp(28px, 4vw, 48px);

      line-height:
        1.28;

      letter-spacing:
        -1.5px;

      color:
        #aeb8ca;

    }


    .about-text strong {

      color:
        #ffffff;

    }


    /* =====================================================
       SKILLS
    ===================================================== */

    .skills {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        12px;

    }


    .skill {

      padding:
        14px 20px;

      border-radius:
        999px;

      color:
        #b5c0d3;

      font-size:
        13px;

      background:
        rgba(255,255,255,0.035);

      border:
        1px solid
        rgba(255,255,255,0.08);

      transition:
        0.3s ease;

    }


    .skill:hover {

      transform:
        translateY(-3px);

      border-color:
        rgba(100,160,255,0.35);

      background:
        rgba(91,140,255,0.1);

    }


    /* =====================================================
       PROCESS
    ===================================================== */

    .process {

      display:
        grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap:
        18px;

    }


    .step {

      min-height:
        230px;

      padding:
        30px;

      border-left:
        1px solid
        rgba(255,255,255,0.1);

    }


    .step-number {

      color:
        #7199df;

      font-size:
        12px;

      font-weight:
        800;

      margin-bottom:
        50px;

    }


    .step h3 {

      font-size:
        20px;

      margin-bottom:
        12px;

    }


    .step p {

      color:
        #7f8ba0;

      font-size:
        13px;

      line-height:
        1.7;

    }


    /* =====================================================
       CONTACT
    ===================================================== */

    .contact-box {

      position:
        relative;

      overflow:
        hidden;

      text-align:
        center;

      padding:
        105px 30px;

      border-radius:
        35px;

      border:
        1px solid
        rgba(255,255,255,0.1);

      background:

        radial-gradient(
          circle at 50% 0%,
          rgba(80,140,255,0.17),
          transparent 55%
        ),

        rgba(255,255,255,0.025);

    }


    .contact-box::before {

      content:
        "";

      position:
        absolute;

      width:
        450px;

      height:
        450px;

      border-radius:
        50%;

      background:

        radial-gradient(
          circle,
          rgba(170,110,255,0.1),
          transparent 70%
        );

      bottom:
        -280px;

      left:
        -100px;

      pointer-events:
        none;
