<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTKARSH — Digital Portfolio</title>
<meta name="description" content="Utkarsh — creative digital portfolio. Design, development and interactive digital experiences.">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  background:#050505;
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

body.no-scroll{
  overflow:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

::selection{
  background:#fff;
  color:#000;
}

::-webkit-scrollbar{
  width:7px;
}

::-webkit-scrollbar-track{
  background:#050505;
}

::-webkit-scrollbar-thumb{
  background:#292929;
  border-radius:20px;
}

:root{
  --white:#fff;
  --soft:rgba(255,255,255,.68);
  --muted:rgba(255,255,255,.4);
  --line:rgba(255,255,255,.1);
  --glass:rgba(255,255,255,.035);
}

/* =====================================================
   GLOBAL ATMOSPHERE
===================================================== */

.noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9990;
  opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}

.ambient{
  position:fixed;
  width:650px;
  height:650px;
  border-radius:50%;
  pointer-events:none;
  filter:blur(100px);
  opacity:.12;
  z-index:-2;
}

.ambient.one{
  top:-350px;
  right:-250px;
  background:#fff;
  animation:ambientOne 12s ease-in-out infinite;
}

.ambient.two{
  bottom:-400px;
  left:-300px;
  background:#525cff;
  opacity:.06;
  animation:ambientTwo 15s ease-in-out infinite;
}

@keyframes ambientOne{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-80px,80px)}
}

@keyframes ambientTwo{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(80px,-70px)}
}

/* =====================================================
   CINEMATIC INTRO
===================================================== */

.intro{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.intro.hide{
  pointer-events:none;
  animation:introOut 1.2s cubic-bezier(.76,0,.24,1) forwards;
}

@keyframes introOut{
  0%{
    opacity:1;
    transform:scale(1);
  }
  100%{
    opacity:0;
    transform:scale(1.04);
  }
}

.intro-stage{
  text-align:center;
  width:min(900px,90%);
}

.intro-small{
  color:rgba(255,255,255,.35);
  font-size:10px;
  letter-spacing:5px;
  margin-bottom:28px;
  opacity:0;
  animation:introSmall 1s .2s forwards;
}

@keyframes introSmall{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.intro-name{
  font-size:clamp(70px,14vw,180px);
  line-height:.8;
  letter-spacing:-10px;
  font-weight:900;
  overflow:hidden;
}

.intro-name span{
  display:inline-block;
  opacity:0;
  transform:translateY(110%);
  animation:letterUp .9s cubic-bezier(.16,1,.3,1) forwards;
}

.intro-name span:nth-child(1){animation-delay:.35s}
.intro-name span:nth-child(2){animation-delay:.42s}
.intro-name span:nth-child(3){animation-delay:.49s}
.intro-name span:nth-child(4){animation-delay:.56s}
.intro-name span:nth-child(5){animation-delay:.63s}
.intro-name span:nth-child(6){animation-delay:.70s}
.intro-name span:nth-child(7){animation-delay:.77s}
.intro-name span:nth-child(8){animation-delay:.84s}

@keyframes letterUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.intro-role{
  height:35px;
  margin-top:35px;
  overflow:hidden;
  color:rgba(255,255,255,.48);
  font-size:13px;
  letter-spacing:5px;
  text-transform:uppercase;
}

.intro-role span{
  display:block;
  opacity:0;
  transform:translateY(100%);
}

.intro-role .r1{
  animation:roleOne .7s 1.55s forwards;
}

.intro-role .r2{
  animation:roleTwo .7s 2.35s forwards;
}

@keyframes roleOne{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes roleTwo{
  from{
    opacity:0;
    transform:translateY(100%);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.intro-line{
  width:0;
  height:1px;
  margin:32px auto 0;
  background:#fff;
  animation:introLine 1.2s 2.9s forwards;
}

@keyframes introLine{
  to{
    width:min(300px,60vw);
  }
}

/* =====================================================
   NAV
===================================================== */

.nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:78px;
  z-index:900;
  display:flex;
  align-items:center;
  transition:
    transform .55s cubic-bezier(.76,0,.24,1),
    background .4s ease,
    border .4s ease;
}

.nav.scrolled{
  background:rgba(5,5,5,.78);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.nav.hidden{
  transform:translateY(-100%);
}

.nav-inner{
  width:min(1180px,90%);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-weight:900;
  letter-spacing:2px;
  font-size:20px;
}

.nav-links{
  display:flex;
  gap:30px;
}

.nav-links a{
  position:relative;
  font-size:13px;
  color:rgba(255,255,255,.45);
  transition:.3s ease;
}

.nav-links a:hover,
.nav-links a.active{
  color:#fff;
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-8px;
  width:0;
  height:1px;
  background:#fff;
  transition:.3s ease;
}

.nav-links a:hover::after,
.nav-links a.active::after{
  width:100%;
}

.menu{
  display:none;
  width:42px;
  height:42px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  border-radius:50%;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:5px;
}

.menu span{
  width:15px;
  height:1px;
  background:#fff;
}

/* =====================================================
   SCROLL PROGRESS
===================================================== */

.progress{
  position:fixed;
  top:0;
  left:0;
  width:0;
  height:2px;
  background:#fff;
  z-index:2000;
  box-shadow:0 0 15px rgba(255,255,255,.7);
}

/* =====================================================
   COMMON
===================================================== */

.container{
  width:min(1180px,90%);
  margin:auto;
}

section{
  position:relative;
}

.section{
  padding:150px 0;
}

.label{
  color:rgba(255,255,255,.32);
  text-transform:uppercase;
  letter-spacing:4px;
  font-size:10px;
  margin-bottom:22px;
}

.title{
  font-size:clamp(50px,8vw,105px);
  letter-spacing:-6px;
  line-height:.86;
  font-weight:800;
}

.muted{
  color:rgba(255,255,255,.28);
}

.reveal{
  opacity:0;
  transform:
    translateY(70px)
    translateZ(-80px)
    rotateX(6deg)
    scale(.96);
  transform-origin:center bottom;
  transition:
    opacity 1s cubic-bezier(.16,1,.3,1),
    transform 1.2s cubic-bezier(.16,1,.3,1);
}

.reveal.show{
  opacity:1;
  transform:
    translateY(0)
    translateZ(0)
    rotateX(0)
    scale(1);
}

/* =====================================================
   HERO
===================================================== */

.hero{
  min-height:100svh;
  display:flex;
  align-items:center;
  padding-top:100px;
  overflow:hidden;
  perspective:1200px;
}

.hero-bg-number{
  position:absolute;
  right:-4vw;
  bottom:-8vw;
  font-size:35vw;
  line-height:.7;
  font-weight:900;
  color:rgba(255,255,255,.018);
  pointer-events:none;
  user-select:none;
  transform:translateZ(-300px);
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  align-items:center;
  gap:70px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 15px;
  border:1px solid var(--line);
  border-radius:100px;
  background:rgba(255,255,255,.025);
  color:rgba(255,255,255,.5);
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:30px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 14px #fff;
  animation:dotPulse 1.8s infinite;
}

@keyframes dotPulse{
  0%,100%{opacity:.35;transform:scale(.7)}
  50%{opacity:1;transform:scale(1)}
}

.hero-title{
  font-size:clamp(58px,8vw,112px);
  line-height:.84;
  letter-spacing:-7px;
  font-weight:900;
  margin-bottom:35px;
}

.hero-title .line{
  display:block;
  overflow:hidden;
}

.hero-title .line span{
  display:inline-block;
  transform:translateY(110%);
  animation:titleIn 1.1s cubic-bezier(.16,1,.3,1) forwards;
}

.hero-title .line:nth-child(1) span{
  animation-delay:3.45s;
}

.hero-title .line:nth-child(2) span{
  animation-delay:3.58s;
}

.hero-title .line:nth-child(3) span{
  animation-delay:3.71s;
}

@keyframes titleIn{
  to{
    transform:translateY(0);
  }
}

.hero-description{
  max-width:600px;
  color:var(--soft);
  font-size:17px;
  line-height:1.8;
  margin-bottom:35px;
  opacity:0;
  animation:fadeUp 1s 3.9s forwards;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.buttons{
  display:flex;
  gap:13px;
  flex-wrap:wrap;
  opacity:0;
  animation:fadeUp 1s 4.05s forwards;
}

.btn{
  padding:15px 24px;
  border-radius:100px;
  font-size:13px;
  font-weight:700;
  transition:
    transform .3s ease,
    background .3s ease;
}

.btn:hover{
  transform:translateY(-4px);
}

.btn.primary{
  color:#000;
  background:#fff;
}

.btn.secondary{
  color:rgba(255,255,255,.75);
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
}

/* =====================================================
   3D HERO OBJECT
===================================================== */

.hero-scene{
  height:540px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1200px;
  transform-style:preserve-3d;
}

.core{
  width:270px;
  height:270px;
  border-radius:50%;
  position:relative;
  background:
    radial-gradient(
      circle at 28% 22%,
      #fff 0%,
      rgba(255,255,255,.65) 5%,
      rgba(255,255,255,.14) 28%,
      rgba(255,255,255,.025) 55%,
      #000 100%
    );
  box-shadow:
    0 0 90px rgba(255,255,255,.1),
    inset -45px -40px 70px rgba(0,0,0,.75);
  transform-style:preserve-3d;
  animation:coreFloat 6s ease-in-out infinite;
}

@keyframes coreFloat{
  0%,100%{
    transform:translateY(0) translateZ(20px) rotateY(0);
  }
  50%{
    transform:translateY(-20px) translateZ(45px) rotateY(7deg);
  }
}

.core::before{
  content:"";
  position:absolute;
  inset:-45px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 0 70px rgba(255,255,255,.05);
}

.core::after{
  content:"";
  position:absolute;
  inset:22px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
}

.ring{
  position:absolute;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  transform-style:preserve-3d;
}

.ring.r1{
  width:400px;
  height:130px;
  transform:rotate(-20deg) translateZ(20px);
  animation:ringRotate 11s linear infinite;
}

.ring.r2{
  width:430px;
  height:150px;
  transform:rotate(58deg) translateZ(-10px);
  border-color:rgba(255,255,255,.08);
  animation:ringRotate2 14s linear infinite;
}

.ring.r3{
  width:330px;
  height:100px;
  transform:rotate(90deg) translateZ(35px);
  border-color:rgba(255,255,255,.06);
  animation:ringRotate 9s linear infinite reverse;
}

@keyframes ringRotate{
  from{transform:rotate(-20deg) translateZ(20px)}
  to{transform:rotate(340deg) translateZ(20px)}
}

@keyframes ringRotate2{
  from{transform:rotate(58deg) translateZ(-10px)}
  to{transform:rotate(-302deg) translateZ(-10px)}
}

.scene-label{
  position:absolute;
  right:0;
  bottom:35px;
  padding:13px 17px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.035);
  backdrop-filter:blur(15px);
  color:rgba(255,255,255,.4);
  font-size:9px;
  letter-spacing:2px;
}

/* =====================================================
   MARQUEE
===================================================== */

.marquee{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  overflow:hidden;
  padding:20px 0;
  white-space:nowrap;
}

.marquee-track{
  display:inline-flex;
  gap:45px;
  animation:marquee 24s linear infinite;
}

.marquee span{
  color:rgba(255,255,255,.22);
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
}

@keyframes marquee{
  to{
    transform:translateX(-50%);
  }
}

/* =====================================================
   SERVICES
===================================================== */

.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  perspective:1200px;
}

.card{
  min-height:310px;
  padding:32px;
  border:1px solid var(--line);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.015)
    );
  border-radius:28px;
  position:relative;
  overflow:hidden;
  transform-style:preserve-3d;
  transition:
    transform .25s ease,
    border-color .3s ease;
}

.card:hover{
  border-color:rgba(255,255,255,.24);
}

.card-number{
  color:rgba(255,255,255,.25);
  font-size:11px;
  letter-spacing:2px;
  transform:translateZ(20px);
}

.card h3{
  position:absolute;
  left:32px;
  bottom:75px;
  font-size:30px;
  letter-spacing:-1px;
  transform:translateZ(35px);
}

.card p{
  position:absolute;
  left:32px;
  right:32px;
  bottom:32px;
  color:rgba(255,255,255,.42);
  font-size:14px;
  line-height:1.6;
  transform:translateZ(20px);
}

.card-glow{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  filter:blur(55px);
  top:-80px;
  right:-70px;
  transition:.5s ease;
}

.card:hover .card-glow{
  transform:scale(1.4);
  opacity:.8;
}

/* =====================================================
   PROJECTS
===================================================== */

.project-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:30px;
  margin-bottom:60px;
}

.project-head p{
  max-width:360px;
  color:rgba(255,255,255,.38);
  line-height:1.7;
}

.projects{
  border-top:1px solid var(--line);
}

.project{
  display:grid;
  grid-template-columns:80px 1fr 40px;
  gap:25px;
  align-items:center;
  padding:42px 5px;
  border-bottom:1px solid var(--line);
  transition:
    padding .45s cubic-bezier(.16,1,.3,1),
    background .45s ease;
}

.project:hover{
  padding-left:25px;
  padding-right:25px;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,.045),
    transparent
  );
}

.project-num{
  color:rgba(255,255,255,.25);
  font-size:12px;
}

.project-main h3{
  font-size:clamp(27px,4vw,48px);
  letter-spacing:-2px;
  margin-bottom:8px;
  transition:transform .4s ease;
}

.project:hover h3{
  transform:translateX(7px);
}

.project-main p{
  color:rgba(255,255,255,.38);
  font-size:14px;
}

.project-cat{
  margin-top:12px;
  color:rgba(255,255,255,.22);
  text-transform:uppercase;
  font-size:9px;
  letter-spacing:2px;
}

.project-arrow{
  font-size:27px;
  color:rgba(255,255,255,.3);
  transition:.4s ease;
}

.project:hover .project-arrow{
  color:#fff;
  transform:translateX(8px);
}

/* =====================================================
   3D PINNED STYLE VISUAL
===================================================== */

.depth-section{
  min-height:100vh;
  display:flex;
  align-items:center;
  overflow:hidden;
  perspective:1400px;
}

.depth-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:90px;
  align-items:center;
}

.depth-copy h2{
  font-size:clamp(48px,7vw,90px);
  line-height:.88;
  letter-spacing:-5px;
  margin-bottom:30px;
}

.depth-copy p{
  max-width:520px;
  color:rgba(255,255,255,.45);
  line-height:1.8;
}

.depth-object{
  height:520px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-style:preserve-3d;
}

.depth-square{
  width:260px;
  height:260px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.025);
  transform:
    rotateX(58deg)
    rotateZ(45deg)
    translateZ(40px);
  box-shadow:
    40px 40px 0 rgba(255,255,255,.015),
    80px 80px 0 rgba(255,255,255,.01);
  animation:depthFloat 6s ease-in-out infinite;
}

.depth-square::before,
.depth-square::after{
  content:"";
  position:absolute;
  inset:28px;
  border:1px solid rgba(255,255,255,.08);
}

.depth-square::after{
  inset:58px;
}

@keyframes depthFloat{
  0%,100%{
    transform:
      rotateX(58deg)
      rotateZ(45deg)
      translateZ(40px)
      translateY(0);
  }
  50%{
    transform:
      rotateX(58deg)
      rotateZ(45deg)
      translateZ(90px)
      translateY(-20px);
  }
}

/* =====================================================
   ABOUT
===================================================== */

.about{
  min-height:85vh;
  display:flex;
  align-items:center;
}

.about-grid{
  display:grid;
  grid-template-columns:.7fr 1.3fr;
  gap:80px;
}

.about-side{
  color:rgba(255,255,255,.3);
  font-size:12px;
  line-height:2;
  letter-spacing:1px;
}

.about-main{
  font-size:clamp(31px,5vw,63px);
  line-height:1.15;
  letter-spacing:-2px;
  color:rgba(255,255,255,.65);
}

.about-main strong{
  color:#fff;
}

/* =====================================================
   PROCESS
===================================================== */

.process-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.process{
  min-height:240px;
  padding:30px 20px;
  border-right:1px solid var(--line);
  position:relative;
  transition:
    background .4s ease,
    transform .4s ease;
}

.process:last-child{
  border-right:none;
}

.process:hover{
  background:rgba(255,255,255,.035);
  transform:translateY(-8px);
}

.process-num{
  color:rgba(255,255,255,.2);
  font-size:11px;
}

.process h3{
  position:absolute;
  bottom:55px;
  font-size:21px;
}

.process p{
  position:absolute;
  bottom:25px;
  color:rgba(255,255,255,.3);
  font-size:11px;
}

/* =====================================================
   CONTACT
===================================================== */

.contact{
  padding:170px 0 120px;
}

.contact-box{
  min-height:620px;
  border:1px solid var(--line);
  border-radius:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(255,255,255,.09),
      transparent 42%
    );
  perspective:1000px;
}

.contact-box::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border:1px solid rgba(255,255,255,.05);
  border-radius:50%;
  animation:contactRing 12s linear infinite;
}

.contact-box::after{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  border:1px solid rgba(255,255,255,.025);
  border-radius:50%;
  animation:contactRing 18s linear infinite reverse;
}

@keyframes contactRing{
  from{
    transform:rotate(0) scale(1);
  }
  to{
    transform:rotate(360deg) scale(1.03);
  }
}

.contact-content{
  position:relative;
  z-index:2;
}

.contact-label{
  color:rgba(255,255,255,.3);
  font-size:10px;
  letter-spacing:4px;
  margin-bottom:25px;
}

.contact h2{
  font-size:clamp(55px,9vw,125px);
  line-height:.82;
  letter-spacing:-7px;
  margin-bottom:35px;
}

.contact p{
  color:rgba(255,255,255,.42);
  margin-bottom:30px;
}
